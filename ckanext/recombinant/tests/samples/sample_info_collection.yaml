dataset_type: sampleinfo
target_dataset: sampleinfo


title: Sample Info Collection Dataset Type
shortname: Sample Info Collection Dataset Type
notes: Sample Info Collection Dataset Type


template_version: 3

portal_type: dataset
collection: sample

resources:
- title: Sample Resource
  resource_name: sampleinfo

  published_resource_id: 1495491e-338c-22ec-8715-ecb48c67d17e

  display_card:
    title_field: reference_number
    display_fields:
      - year
      - description

  create_form: true
  edit_form: true
  webform_only: true
  fields:
  - datastore_id: reference_number
    label:
      en: Reference Number
      fr: Reference Number FR
    description:
      en: Sample Reference Number Field
      fr: Sample Reference Number Field FR
    obligation: Mandatory
    form_required: true
    format_type: Free text
    validation: This field must not be empty
    visible_to_public: Yes
    occurrence: Single
    datastore_type: text

  - datastore_id: year
    datastore_type: year
    label: Year
    description:
      en: Sample Year Field
      fr: SampleYear Field FR
    obligation: Mandatory
    form_required: true
    validation: This field must not be empty
    extract_date_year: true
    form_attrs:
      size: 20

  - datastore_id: description
    datastore_type: text
    label: Description
    description:
      en: Sample Description Field
      fr: Sample Description Field FR
    obligation: Mandatory
    form_required: true
    format_type: Free text
    validation: This field must not be empty
    form_attrs:
      size: 20

  datastore_primary_key: ["reference_number", "year"]
  datastore_indexes: ""

  default_preview_sort: year, reference_number

  triggers:
  - test_trigger_1: |
      DECLARE
        errors text[][] := '{{}}';
        crval RECORD;
      BEGIN
        errors := errors || required_error(NEW.reference_number, 'reference_number');
        errors := errors || required_error(NEW.year, 'year');
        errors := errors || required_error(NEW.description, 'description');

        IF errors = '{{}}' THEN
          RETURN NEW;
        END IF;
        RAISE EXCEPTION E'TAB-DELIMITED\t%', array_to_string(errors, E'\t');
      END;

  examples:
    record:
      reference_number: "T-2019-Q3-00001"
      year: 2024
      description: "description of info"
    filter_one:
      reference_number: T-2019-Q3-00001
    sort: year, reference_number

